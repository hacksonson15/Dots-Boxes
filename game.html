<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080b18">
<title>Dots & Boxes 3D - Game</title>
<link rel="preconnect" href="https://fra.cloud.appwrite.io">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

<style>
:root {
  --bg:#080b18;
  --bg2:#11182d;
  --border:rgba(255,255,255,.14);
  --text:#f8fafc;
  --muted:#9aa8c7;
  --accent:#3295ff;
  --p2-color:#ff3eaa;
  --shadow:0 25px 70px rgba(0,0,0,.55);
}
* { box-sizing:border-box; margin:0; padding:0; user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; touch-action:none; position:fixed; top:0; left:0; overscroll-behavior:none; }
body {
  padding:12px; display:flex; align-items:center; justify-content:center;
  color:var(--text); font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg),var(--bg2));
}
body::before {
  content:""; position:fixed; inset:0;
  background: radial-gradient(circle at 10% 10%,rgba(65,130,255,.18),transparent 35%),
              radial-gradient(circle at 90% 90%,rgba(200,50,255,.14),transparent 35%);
  pointer-events:none; z-index:0;
}
.hidden { display:none!important; }
.game-container {
  width:min(94vw,680px); max-height:calc(100dvh - 24px); padding:24px; text-align:center;
  border:1px solid var(--border); border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.13); animation:cardIn .4s ease;
  overflow-y:auto; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:space-between;
}
@keyframes cardIn {
  from { opacity:0; transform:translateY(20px) scale(.96); }
  to { opacity:1; transform:translateY(0) scale(1); }
}
h1 {
  width:100%; padding-right:120px; margin-bottom:12px; text-align:left;
  font-size:clamp(1.4rem,4vw,2.2rem); letter-spacing:1px;
  background:linear-gradient(90deg,#fff,var(--accent),var(--p2-color));
  -webkit-background-clip:text; color:transparent;
}
button {
  width:100%; margin:6px 0; padding:12px 16px; border:1px solid rgba(255,255,255,.18);
  border-radius:14px; color:#07101e; background:linear-gradient(135deg,#91bdff,var(--accent));
  font-size:15px; font-weight:800; cursor:pointer; transition:.2s ease;
  box-shadow:0 6px 0 #426da9,0 12px 22px rgba(64,135,255,.25);
}
.btn-back {
  color:white; background:linear-gradient(135deg,#465273,#29334f);
  box-shadow:0 6px 0 #1a2239,0 12px 20px rgba(0,0,0,.25);
}
.countdown-overlay {
  position: absolute; inset: 0; background: rgba(8, 11, 24, 0.90);
  backdrop-filter: blur(3px); z-index: 20; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
}
.countdown-num {
  font-size: 5rem; font-weight: 900; color: var(--accent);
  animation: popNum 0.8s ease infinite;
}
@keyframes popNum {
  0% { transform: scale(0.5); opacity: 0; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}
.game-toolbar { position:absolute; top:16px; right:16px; z-index:5; display:flex; gap:6px; }
.icon-btn {
  width:34px; height:34px; margin:0; padding:0; display:flex; align-items:center;
  justify-content:center; color:#eaf2ff; background:linear-gradient(145deg,#35476c,#1a2744);
  font-size:18px; box-shadow:0 4px 0 #111b31,0 6px 12px rgba(0,0,0,.35);
}
.setup-panel {
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:12px; padding:10px 14px; border:1px solid rgba(255,255,255,.1);
  border-radius:16px; background:rgba(255,255,255,.06);
}
.setup-panel label { color:var(--muted); font-weight:700; font-size:14px; }
.setup-panel select { width:auto; padding:6px 10px; background:#26334f; font-size:14px; color: white; border-radius: 8px; }
.scoreboard { display:flex; width:100%; gap:10px; margin-bottom:14px; }
.score-card { flex:1; padding:10px; border:2px solid transparent; border-radius:16px; background:rgba(255,255,255,.06); }
.score-card.active-p1 { border-color:var(--accent); box-shadow:0 0 18px var(--accent); }
.score-card.active-ai { border-color:var(--p2-color); box-shadow:0 0 18px var(--p2-color); }
.player-name { margin-bottom:3px; color:var(--muted); font-size:.85rem; }
.score-val { font-size:1.6rem; font-weight:900; }
.p1-text { color:var(--accent); }
.ai-text { color:var(--p2-color); }

.board {
  width:fit-content; max-width:100%; margin:0 auto; padding:12px; overflow:hidden;
  border:1px solid rgba(255,255,255,.1); border-radius:20px; background:rgba(2,8,23,.62); touch-action:none;
}
.board .row { width:max-content; margin:0 auto; display:flex; align-items:center; justify-content:center; }
.dot {
  width:12px; height:12px; flex:0 0 12px; z-index:2; border-radius:50%; background:#aebbd4;
  box-shadow:0 0 0 2px rgba(255,255,255,.08),0 0 10px rgba(174,187,212,.6);
}
.h-line, .v-line {
  z-index:1; border-radius:6px; background:#26344d; cursor:pointer;
  transition:background .15s,box-shadow .15s; will-change:background;
}
.h-line:hover:not(.taken), .v-line:hover:not(.taken) { background:#6680a9; box-shadow:0 0 10px rgba(114,167,255,.8); }
.h-line { height:10px; }
.v-line { width:10px; }
.grid-3 .h-line { width:60px; } .grid-3 .v-line { height:60px; } .grid-3 .box { width:60px;height:60px; }
.grid-4 .h-line { width:46px; } .grid-4 .v-line { height:46px; } .grid-4 .box { width:46px;height:46px; }
.grid-5 .h-line { width:34px; } .grid-5 .v-line { height:34px; } .grid-5 .box { width:34px;height:34px; }
.line.taken.p1 { background:var(--accent); box-shadow:0 0 12px var(--accent); cursor:default; }
.line.taken.ai { background:var(--p2-color); box-shadow:0 0 12px var(--p2-color); cursor:default; }
.box {
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(255,255,255,.04); border-radius:6px; font-size:1.1rem; font-weight:900; text-transform: uppercase;
}
.box.filled-p1 { color:#ffffff; background:var(--accent); opacity:0.85; }
.box.filled-ai { color:#ffffff; background:var(--p2-color); opacity:0.85; }
.controls { width:100%; margin-top:12px; }
.modal {
  position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
  padding:16px; background:rgba(0,0,0,.82); backdrop-filter:blur(4px);
}
.modal-content {
  width:min(92vw,360px); padding:26px; text-align:center; border:1px solid rgba(255,255,255,.2);
  border-radius:22px; background:linear-gradient(145deg,#293655,#151d34);
}
.modal-content h2 { color:var(--accent); }
.modal-content p { margin-bottom:18px; }
</style>
</head>
<body>

<div id="game-page" class="game-container">
  <div id="countdown-overlay" class="countdown-overlay hidden">
    <div id="countdown-text" class="countdown-num">3</div>
  </div>

  <div class="game-toolbar">
    <button class="icon-btn" id="restart-icon" title="Restart Game" onclick="handleRestart()">↻</button>
    <button class="icon-btn" id="pause-icon" title="Pause Game" onclick="togglePause()">⏸</button>
    <button class="icon-btn" id="settings-icon" title="Settings" onclick="leaveGame()">⚙</button>
  </div>

  <h1>Dots & Boxes</h1>

  <div class="setup-panel">
    <label for="grid-select">Grid Size</label>
    <select id="grid-select" onchange="initGame(true)">
      <option value="3">Small — 3 × 3</option>
      <option value="4" selected>Medium — 4 × 4</option>
      <option value="5">Large — 5 × 5</option>
    </select>
  </div>

  <div class="scoreboard">
    <div id="p1-card" class="score-card active-p1">
      <div class="player-name p1-text" id="player-display-name">You</div>
      <div id="p1-score" class="score-val">0</div>
    </div>
    <div id="ai-card" class="score-card">
      <div class="player-name ai-text" id="opponent-display-name">CPU</div>
      <div id="ai-score" class="score-val">0</div>
    </div>
  </div>

  <div id="board" class="board grid-4"></div>

  <div class="controls">
    <button class="btn-back" onclick="leaveGame()">Back to Menu</button>
  </div>
</div>

<div id="game-over-modal" class="modal">
  <div class="modal-content">
    <h2 id="winner-title">Game Over</h2>
    <p id="winner-msg"></p>
    <button id="modal-reset-btn" onclick="initGame(true)">Play Again</button>
  </div>
</div>

<script src="appwrite-config.js"></script>
<script>
let loggedInUser = localStorage.getItem("loggedInUser") || "You";
let gameMode = localStorage.getItem("gameMode") || "computer";
let myRole = localStorage.getItem("myRole") || "p1";
let currentGameDoc = localStorage.getItem("currentGameDoc") ? JSON.parse(localStorage.getItem("currentGameDoc")) : null;

let gameUnsubscribe = null;
let isPaused = false;

let p1Name = "You";
let p2Name = "CPU";
let p1Color = localStorage.getItem("p1Color") || "#3295ff";
let p2Color = "#ff3eaa";

const P1 = "p1";
const AI = "ai";

let gridSize = 4;
let startingPlayer = P1;
let currentPlayer = P1;
let p1Score = 0;
let aiScore = 0;
let hLines = [];
let vLines = [];
let boxes = [];

const boardEl = document.getElementById("board");
const p1ScoreEl = document.getElementById("p1-score");
const aiScoreEl = document.getElementById("ai-score");
const p1Card = document.getElementById("p1-card");
const aiCard = document.getElementById("ai-card");
const gridSelect = document.getElementById("grid-select");
const modal = document.getElementById("game-over-modal");
const winnerTitle = document.getElementById("winner-title");
const winnerMsg = document.getElementById("winner-msg");
const pauseIcon = document.getElementById("pause-icon");

window.onload = () => {
  if (gameMode === "online" && currentGameDoc) {
    listenToGameUpdates(currentGameDoc.$id);
    startCountdownAndPlay(currentGameDoc);
  } else {
    p1Name = loggedInUser;
    p2Name = "CPU";
    document.getElementById("player-display-name").textContent = p1Name;
    document.getElementById("opponent-display-name").textContent = p2Name;
    initGame(true);
  }
};

function startCountdownAndPlay(doc) {
  p1Name = doc.player1;
  p2Name = doc.player2 || "Player 2";
  p1Color = doc.p1Color || "#3295ff";
  p2Color = doc.p2Color || "#ff3eaa";

  document.documentElement.style.setProperty("--accent", p1Color);
  document.documentElement.style.setProperty("--p2-color", p2Color);

  document.getElementById("player-display-name").textContent = p1Name;
  document.getElementById("opponent-display-name").textContent = p2Name;
  gridSelect.disabled = true;

  initGame(true);

  const overlay = document.getElementById("countdown-overlay");
  const countText = document.getElementById("countdown-text");
  overlay.classList.remove("hidden");

  let count = 3;
  countText.textContent = count;

  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      countText.textContent = count;
    } else if (count === 0) {
      countText.textContent = "Ready Go!";
    } else {
      clearInterval(timer);
      overlay.classList.add("hidden");
    }
  }, 900);
}

function listenToGameUpdates(gameId) {
  if (gameUnsubscribe) gameUnsubscribe();

  gameUnsubscribe = appwriteClient.subscribe(
    `databases.${DATABASE_ID}.collections.${COLLECTION_GAMES}.documents.${gameId}`,
    response => {
      const doc = response.payload;

      if (doc.status === 'playing') {
        if (doc.isPaused !== isPaused) {
          isPaused = doc.isPaused;
          togglePauseUI(isPaused);
        }

        if (doc.isRestarted) {
          initGame(true);
          if (myRole === P1) {
            databases.updateDocument(DATABASE_ID, COLLECTION_GAMES, gameId, { isRestarted: false });
          }
        }

        if (doc.lastMove) {
          const moveData = JSON.parse(doc.lastMove);
          if (moveData.sender !== myRole) {
            executeMoveLocally(moveData.type, moveData.r, moveData.c, moveData.sender);
          }
        }
      }
    }
  );
}

function initGame(fullReset = false) {
  gridSize = parseInt(gridSelect.value);
  p1Score = 0;
  aiScore = 0;
  p1ScoreEl.textContent = "0";
  aiScoreEl.textContent = "0";
  modal.style.display = "none";
  isPaused = false;
  togglePauseUI(false);

  if (fullReset) {
    startingPlayer = P1;
  } else {
    startingPlayer = startingPlayer === P1 ? AI : P1;
  }

  currentPlayer = startingPlayer;

  hLines = Array.from({ length:gridSize + 1 }, () => Array(gridSize).fill(null));
  vLines = Array.from({ length:gridSize }, () => Array(gridSize + 1).fill(null));
  boxes = Array.from({ length:gridSize }, () => Array(gridSize).fill(null));

  updateTurnUI();
  renderBoard();

  if (gameMode === "computer" && currentPlayer === AI) {
    setTimeout(aiMove, 500);
  }
}

function renderBoard() {
  boardEl.innerHTML = "";
  boardEl.className = "board grid-" + gridSize;

  for (let r = 0; r <= gridSize; r++) {
    const hRow = document.createElement("div");
    hRow.className = "row";

    for (let c = 0; c < gridSize; c++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      hRow.appendChild(dot);

      const line = document.createElement("div");
      line.className = "h-line line";
      line.dataset.type = "h";
      line.dataset.r = r;
      line.dataset.c = c;
      line.addEventListener("click", handleLineClick);
      hRow.appendChild(line);
    }

    const lastDot = document.createElement("div");
    lastDot.className = "dot";
    hRow.appendChild(lastDot);
    boardEl.appendChild(hRow);

    if (r < gridSize) {
      const vRow = document.createElement("div");
      vRow.className = "row";

      for (let c = 0; c <= gridSize; c++) {
        const line = document.createElement("div");
        line.className = "v-line line";
        line.dataset.type = "v";
        line.dataset.r = r;
        line.dataset.c = c;
        line.addEventListener("click", handleLineClick);
        vRow.appendChild(line);

        if (c < gridSize) {
          const box = document.createElement("div");
          box.className = "box";
          box.id = `box-${r}-${c}`;
          vRow.appendChild(box);
        }
      }
      boardEl.appendChild(vRow);
    }
  }
}

async function handleLineClick(event) {
  if (isPaused) return;
  if (currentPlayer !== myRole) return;

  const type = event.target.dataset.type;
  const r = parseInt(event.target.dataset.r);
  const c = parseInt(event.target.dataset.c);

  if (gameMode === "online") {
    if (executeMoveLocally(type, r, c, myRole)) {
      try {
        await databases.updateDocument(
          DATABASE_ID,
          COLLECTION_GAMES,
          currentGameDoc.$id,
          {
            lastMove: JSON.stringify({ type, r, c, sender: myRole }),
            turn: currentPlayer
          }
        );
      } catch (err) {
        console.error("Online move update failed", err);
      }
    }
  } else {
    if (executeMoveLocally(type, r, c, P1)) {
      if (checkGameOver()) return;
      if (currentPlayer === AI) {
        setTimeout(aiMove, 400);
      }
    }
  }
}

function executeMoveLocally(type, r, c, player) {
  const lineArray = type === "h" ? hLines : vLines;
  if (lineArray[r][c] !== null) return false;

  lineArray[r][c] = player;
  const selector = `.line[data-type="${type}"][data-r="${r}"][data-c="${c}"]`;
  const lineElement = document.querySelector(selector);

  if (lineElement) {
    lineElement.classList.add("taken", player);
  }

  const completed = checkBoxes(type, r, c, player);

  if (completed > 0) {
    if (player === P1) p1Score += completed;
    else aiScore += completed;
    updateScores();
  } else {
    currentPlayer = currentPlayer === P1 ? AI : P1;
    updateTurnUI();
  }

  checkGameOver();
  return true;
}

function checkBoxes(type, r, c, player) {
  let completed = 0;
  getAffectedBoxes(type, r, c).forEach(({br, bc}) => {
    if (boxes[br][bc] === null && getBoxEdgeCount(br, bc) === 4) {
      boxes[br][bc] = player;
      const boxElement = document.getElementById(`box-${br}-${bc}`);
      boxElement.classList.add(`filled-${player}`);

      const initial = (player === P1 ? p1Name : p2Name).charAt(0).toUpperCase();
      boxElement.textContent = initial;
      completed++;
    }
  });
  return completed;
}

function getAffectedBoxes(type, r, c) {
  const result = [];
  if (type === "h") {
    if (r > 0) result.push({br:r - 1, bc:c});
    if (r < gridSize) result.push({br:r, bc:c});
  } else {
    if (c > 0) result.push({br:r, bc:c - 1});
    if (c < gridSize) result.push({br:r, bc:c});
  }
  return result;
}

function getBoxEdgeCount(r, c) {
  let count = 0;
  if (hLines[r][c] !== null) count++;
  if (hLines[r + 1][c] !== null) count++;
  if (vLines[r][c] !== null) count++;
  if (vLines[r][c + 1] !== null) count++;
  return count;
}

function aiMove() {
  if (isPaused || currentPlayer !== AI) return;
  const availableMoves = getAllAvailableMoves();
  if (!availableMoves.length) return;

  for (const move of availableMoves) {
    if (createsBox(move)) {
      executeMoveLocally(move.type, move.r, move.c, AI);
      if (!checkGameOver() && currentPlayer === AI) {
        setTimeout(aiMove, 400);
      }
      return;
    }
  }

  const safeMoves = availableMoves.filter(move => !givesAwayBox(move));
  const choice = safeMoves.length
    ? safeMoves[Math.floor(Math.random() * safeMoves.length)]
    : availableMoves[Math.floor(Math.random() * availableMoves.length)];

  executeMoveLocally(choice.type, choice.r, choice.c, AI);

  if (!checkGameOver() && currentPlayer === AI) {
    setTimeout(aiMove, 400);
  }
}

function getAllAvailableMoves() {
  const moves = [];
  for (let r = 0; r <= gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      if (hLines[r][c] === null) moves.push({type:"h", r, c});
    }
  }
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c <= gridSize; c++) {
      if (vLines[r][c] === null) moves.push({type:"v", r, c});
    }
  }
  return moves;
}

function createsBox(move) {
  return getAffectedBoxes(move.type, move.r, move.c).some(({br, bc}) => getBoxEdgeCount(br, bc) === 3);
}

function givesAwayBox(move) {
  return getAffectedBoxes(move.type, move.r, move.c).some(({br, bc}) => getBoxEdgeCount(br, bc) === 2);
}

function updateScores() {
  p1ScoreEl.textContent = p1Score;
  aiScoreEl.textContent = aiScore;
}

function updateTurnUI() {
  p1Card.classList.toggle("active-p1", currentPlayer === P1);
  aiCard.classList.toggle("active-ai", currentPlayer === AI);
}

function checkGameOver() {
  if (p1Score + aiScore !== gridSize * gridSize) return false;

  if (p1Score > aiScore) {
    winnerTitle.textContent = `${p1Name} Won!`;
    winnerMsg.textContent = `Score: ${p1Score} - ${aiScore}.`;
  } else if (aiScore > p1Score) {
    winnerTitle.textContent = `${p2Name} Won!`;
    winnerMsg.textContent = `Score: ${aiScore} - ${p1Score}.`;
  } else {
    winnerTitle.textContent = "It's a Tie!";
    winnerMsg.textContent = `Score: ${p1Score} - ${aiScore}.`;
  }

  modal.style.display = "flex";
  return true;
}

async function togglePause() {
  isPaused = !isPaused;
  togglePauseUI(isPaused);

  if (gameMode === "online" && currentGameDoc) {
    try {
      await databases.updateDocument(DATABASE_ID, COLLECTION_GAMES, currentGameDoc.$id, {
        isPaused: isPaused
      });
    } catch(e) {}
  }
}

function togglePauseUI(paused) {
  pauseIcon.textContent = paused ? "▶" : "⏸";
  boardEl.style.opacity = paused ? "0.4" : "1";
  boardEl.style.pointerEvents = paused ? "none" : "auto";
}

async function handleRestart() {
  if (confirm("Restart game?")) {
    if (gameMode === "online" && currentGameDoc) {
      try {
        await databases.updateDocument(DATABASE_ID, COLLECTION_GAMES, currentGameDoc.$id, {
          isRestarted: true
        });
      } catch(e) {}
    } else {
      initGame(true);
    }
  }
}

function leaveGame() {
  if (gameUnsubscribe) gameUnsubscribe();
  localStorage.removeItem("currentGameDoc");
  window.location.href = "index.html";
}
</script>
</body>
</html>

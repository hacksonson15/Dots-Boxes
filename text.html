<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appwrite Connection Tester</title>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
  <style>
    body { font-family: monospace; padding: 20px; background: #121212; color: #fff; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-bottom: 20px; }
    .box { background: #222; padding: 15px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
    .success { color: #4CAF50; }
    .error { color: #FF5252; }
  </style>
</head>
<body>

  <h2>Appwrite Diagnostic Tool</h2>
  <button onclick="runAppwriteTest()">Run Diagnostic Test</button>

  <div id="output" class="box">Click button to test connection...</div>

  <script>
    const { Client, Account, Databases, ID } = Appwrite;

    const client = new Client();
    client
        .setEndpoint('https://fra.cloud.appwrite.io/v1')
        .setProject('6a98502b0023f61a6477');

    const account = new Account(client);
    const databases = new Databases(client);

    const DATABASE_ID = '6a9853c300262f68c1fd';
    const COLLECTION_ID = 'messages';

    function log(msg, type = 'normal') {
      const out = document.getElementById('output');
      const color = type === 'error' ? '#FF5252' : type === 'success' ? '#4CAF50' : '#888';
      out.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
    }

    async function runAppwriteTest() {
      document.getElementById('output').innerHTML = '';
      log("1. Starting Diagnostic Test...");

      // Step 1: Session Check / Create
      try {
        log("2. Checking Guest Session...");
        await account.createAnonymousSession();
        log("✔ Guest Session Created / Already Active", 'success');
      } catch (err) {
        log("⚠ Session Warning: " + err.message);
      }

      // Step 2: Fetching Messages
      try {
        log("3. Testing Read (listDocuments)...");
        const res = await databases.listDocuments(DATABASE_ID, COLLECTION_ID);
        log(`✔ Read Success! Total documents found: ${res.total}`, 'success');
      } catch (err) {
        log(`❌ Read Failed! Code: ${err.code} | Message: ${err.message}`, 'error');
      }

      // Step 3: Inserting Test Message
      try {
        log("4. Testing Write (createDocument)...");
        const newDoc = await databases.createDocument(
          DATABASE_ID,
          COLLECTION_ID,
          ID.unique(),
          {
            sender: "TestBot",
            text: "Diagnostic Connection Test",
            createdAt: new Date().toISOString()
          }
        );
        log(`✔ Write Success! Document ID: ${newDoc.$id}`, 'success');
      } catch (err) {
        log(`❌ Write Failed! Code: ${err.code} | Message: ${err.message}`, 'error');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080b18">
<title>Dashboard - Dots & Boxes 3D</title>

<style>
:root {
  --bg:#080b18;
  --bg2:#11182d;
  --border:rgba(255,255,255,.14);
  --text:#f8fafc;
  --muted:#9aa8c7;
  --accent:#3295ff;
  --p2-color:#ff3eaa;
  --shadow:0 25px 70px rgba(0,0,0,.55);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
}

html, body {
  width:100%;
  height:100%;
  overflow:hidden;
  position:fixed;
  top:0;
  left:0;
  overscroll-behavior:none;
}

body {
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
  font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg),var(--bg2));
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 10% 10%,rgba(65,130,255,.18),transparent 35%),
    radial-gradient(circle at 90% 90%,rgba(200,50,255,.14),transparent 35%);
  pointer-events:none;
  z-index:0;
}

.hidden {
  display:none!important;
}

.card {
  position:relative;
  z-index:1;
  width:min(92vw,400px);
  max-height:calc(100dvh - 24px);
  padding:24px;
  text-align:center;
  border:1px solid var(--border);
  border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.13);
  animation:cardIn .4s ease;
  overflow-y:auto;
}

@keyframes cardIn {
  from { opacity:0;transform:translateY(20px) scale(.96); }
  to { opacity:1;transform:translateY(0) scale(1); }
}

h2 {
  margin-bottom:16px;
  font-size:1.8rem;
}

p {
  color:var(--muted);
}

.fake-input {
  width:100%;
  padding:12px 14px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  outline:none;
  color:white;
  background:rgba(0,0,0,.25);
  font-size:15px;
  margin:10px 0 16px;
  min-height:46px;
  line-height:1.4;
  cursor:text;
  white-space:nowrap;
  overflow:hidden;
  position:relative;
}

.fake-input:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(114,167,255,.14);
}

.fake-input:empty::before {
  content:attr(data-placeholder);
  color:#71809e;
  pointer-events:none;
}

button {
  width:100%;
  margin:6px 0;
  padding:12px 16px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  color:#07101e;
  background:linear-gradient(135deg,#91bdff,var(--accent));
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
  box-shadow:0 6px 0 #426da9,0 12px 22px rgba(64,135,255,.25);
}

button:hover {
  transform:translateY(-2px);
  opacity:0.92;
}

button:active {
  transform:translateY(3px);
  box-shadow:0 2px 0 #426da9;
}

.btn-back {
  color:white;
  background:linear-gradient(135deg,#465273,#29334f);
  box-shadow:0 6px 0 #1a2239,0 12px 20px rgba(0,0,0,.25);
}

.setting-item {
  margin:16px 0;
  padding:14px;
  text-align:left;
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  background:rgba(255,255,255,.045);
}

.toggle-container {
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.color-options {
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:12px;
}

.color-btn {
  width:36px;
  height:36px;
  padding:0;
  border:3px solid rgba(255,255,255,.75);
  border-radius:50%;
  cursor:pointer;
}

.color-btn.selected {
  transform: scale(1.15);
  border-color: #fff;
  box-shadow: 0 0 10px rgba(255,255,255,0.8);
}

.switch {
  position:relative;
  width:50px;
  height:26px;
}

.switch input {
  opacity:0;
  width:0;
  height:0;
}

.slider {
  position:absolute;
  inset:0;
  cursor:pointer;
  border-radius:30px;
  background:#39445f;
}

.slider::before {
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  bottom:3px;
  border-radius:50%;
  background:white;
  transition:.3s;
}

.switch input:checked + .slider {
  background:var(--accent);
}

.switch input:checked + .slider::before {
  transform:translateX(24px);
}

.alert-info {
  margin-bottom:14px;
  padding:11px;
  border-left:4px solid var(--accent);
  border-radius:12px;
  color:#dce8ff;
  background:rgba(114,167,255,.12);
  font-size:14px;
}
</style>
</head>

<body>

<div id="main-menu" class="card">
  <h2 id="welcome-text">Welcome</h2>
  <button onclick="goToGameMode()">Play Game</button>
  <button onclick="showPage('settings-page')">Settings</button>
  <button onclick="showPage('leaderboard-page')">Leaderboard</button>
  <button onclick="quit()" style="color:white; background:linear-gradient(135deg,#ff7798,#db315b); box-shadow:0 6px 0 #8d1d3d;">Quit</button>
</div>

<div id="settings-page" class="card hidden">
  <h2>Settings</h2>
  <div class="setting-item toggle-container">
    <span>Sound Effects</span>
    <label class="switch">
      <input type="checkbox" id="sound-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="setting-item">
    <label>Select Your Color:</label>
    <div class="color-options">
      <div class="color-btn" style="background:#3295ff" onclick="changeTheme('#3295ff','#080b18', this)"></div>
      <div class="color-btn" style="background:#a6e3a1" onclick="changeTheme('#a6e3a1','#111b13', this)"></div>
      <div class="color-btn" style="background:#f38ba8" onclick="changeTheme('#f38ba8','#1f1315', this)"></div>
      <div class="color-btn" style="background:#fab387" onclick="changeTheme('#fab387','#241a15', this)"></div>
      <div class="color-btn" style="background:#cba6f7" onclick="changeTheme('#cba6f7','#1b1324', this)"></div>
    </div>
  </div>
  <button class="btn-back" onclick="showPage('main-menu')">Back to Menu</button>
</div>

<div id="leaderboard-page" class="card hidden">
  <h2>Leaderboard</h2>
  <div class="alert-info">Enter valid coupon code to unlock secret features.</div>
  <p style="margin-bottom:8px;">Enter coupon code:</p>
  <div id="coupon-code" class="fake-input" contenteditable="true" data-placeholder="Enter Coupon Code" spellcheck="false"></div>
  <button onclick="submitCoupon()">Submit</button>
  <button class="btn-back" onclick="showPage('main-menu')">Back to Menu</button>
</div>

<script>
let loggedInUser = localStorage.getItem("loggedInUser");
if (!loggedInUser) {
  window.location.href = "login.html";
} else {
  document.getElementById("welcome-text").textContent = "Welcome, " + loggedInUser;
}

function showPage(pageId) {
  const pages = ["main-menu", "settings-page", "leaderboard-page"];
  pages.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.add("hidden");
  });
  document.getElementById(pageId).classList.remove("hidden");
}

function changeTheme(accentColor, backgroundColor, btnEl) {
  document.documentElement.style.setProperty("--accent", accentColor);
  document.documentElement.style.setProperty("--bg", backgroundColor);
  
  if(btnEl) {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');
  }
}

function quit() {
  localStorage.removeItem("loggedInUser");
  window.location.href = "login.html";
}

function goToGameMode() {
  window.location.href = "index.html";
}

function submitCoupon() {
  const couponInput = document.getElementById("coupon-code");
  if (couponInput.innerText.trim() === "Gorilla") {
    couponInput.innerText = "";
    window.location.href = "index.html?openChat=true";
  } else {
    alert("Wrong coupon code!");
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080b18">
<title>Dots & Boxes 3D - Login</title>
<style>
:root {
  --bg:#080b18;
  --bg2:#11182d;
  --border:rgba(255,255,255,.14);
  --text:#f8fafc;
  --muted:#9aa8c7;
  --accent:#3295ff;
  --p2-color:#ff3eaa;
  --shadow:0 25px 70px rgba(0,0,0,.55);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
}

html, body {
  width:100%;
  height:100%;
  overflow:hidden;
  position:fixed;
  top:0;
  left:0;
  overscroll-behavior:none;
}

body {
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
  font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg),var(--bg2));
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 10% 10%,rgba(65,130,255,.18),transparent 35%),
    radial-gradient(circle at 90% 90%,rgba(200,50,255,.14),transparent 35%);
  pointer-events:none;
  z-index:0;
}

.card {
  position:relative;
  z-index:1;
  width:min(92vw,400px);
  max-height:calc(100dvh - 24px);
  padding:24px;
  text-align:center;
  border:1px solid var(--border);
  border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.13);
  animation:cardIn .4s ease;
  overflow-y:auto;
}

@keyframes cardIn {
  from { opacity:0;transform:translateY(20px) scale(.96); }
  to { opacity:1;transform:translateY(0) scale(1); }
}

h2 {
  margin-bottom:16px;
  font-size:1.8rem;
}

p {
  color:var(--muted);
}

.fake-input {
  width:100%;
  padding:12px 14px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  outline:none;
  color:white;
  background:rgba(0,0,0,.25);
  font-size:15px;
  margin:10px 0 16px;
  min-height:46px;
  line-height:1.4;
  cursor:text;
  white-space:nowrap;
  overflow:hidden;
  position:relative;
  text-align:left;
  user-select:text;
  -webkit-user-select:text;
}

.fake-input:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(114,167,255,.14);
}

.fake-input:empty::before {
  content:attr(data-placeholder);
  color:#71809e;
  pointer-events:none;
}

button {
  width:100%;
  margin:6px 0;
  padding:12px 16px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  color:#07101e;
  background:linear-gradient(135deg,#91bdff,var(--accent));
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
  box-shadow:0 6px 0 #426da9,0 12px 22px rgba(64,135,255,.25);
}

button:hover {
  transform:translateY(-2px);
  opacity:0.92;
}

button:active {
  transform:translateY(3px);
  box-shadow:0 2px 0 #426da9;
}
</style>
</head>
<body>

<div class="card">
  <h2>Login / Sign Up</h2>
  <p>Enter your unique username:</p>
  <div id="username-input" class="fake-input" contenteditable="true" data-placeholder="Username..." spellcheck="false"></div>
  <button onclick="login()">Enter Dashboard</button>
</div>

<script>
// Agar pehle se login ho to dashboard par redirect karo
if (localStorage.getItem("loggedInUser")) {
  window.location.href = "dashboard.html";
}

function login() {
  const input = document.getElementById("username-input");
  const username = input.innerText.trim();
  
  if (!username) {
    alert("Please enter a username!");
    return;
  }
  
  // Local storage me user save karo
  localStorage.setItem("loggedInUser", username);
  
  // Login k baad ab direct dashboard.html par bhejega
  window.location.href = "dashboard.html";
}

// Enter key press par login submit karein
document.getElementById("username-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    login();
  }
});
</script>

</body>
</html>
